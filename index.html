<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Banking Analytics Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin: 30px; background-color: #f4f6f9; }
        .container { display: flex; flex-direction: column; align-items: center; gap: 30px; }
        .card { background: white; padding: 20px; border-radius: 8px; width: 80%; max-width: 800px; box-shadow: 0px 4px 10px rgba(0,0,0,0.1); }
        img { max-width: 100%; height: auto; border-radius: 4px; margin-top: 15px; }
    </style>
</head>
<body>

    <h1>Banking Transaction Analysis Dashboard</h1>
    <p>Powered by Flask, MySQL, Pandas, and Matplotlib</p>

    <div class="container">
        <!-- Chart 1: Overall Summary -->
        <div class="card">
            <h2>Overall Deposits vs Withdrawals</h2>
            <img src="{{ url_for('static', filename='transaction_chart.png') }}" alt="Overall Transaction Chart">
        </div>

        <!-- Chart 2: Customer-Specific Breakdown -->
        <div class="card">
            <h2>Customer-Specific Transaction Breakdown</h2>
            <img src="{{ url_for('static', filename='customer_transaction_chart.png') }}" alt="Customer Transaction Chart">
        </div>
    </div>

</body>
</html>
